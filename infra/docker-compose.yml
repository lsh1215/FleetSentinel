# FleetSentinel — 로컬 MVP 스택 (SDD §16.1 로컬 실행 스펙)
# Kafka(3-broker KRaft) → Flink(JM+TM) → Iceberg(REST catalog on MinIO) + Elasticsearch → Kibana
#
# 버전 근거: SDD §4.1.1 (Flink 2.0.x / Kafka 4.x KRaft / ES 8.x).
# 로컬 Iceberg 카탈로그: REST(apache/iceberg-rest-fixture) + MinIO(S3, GCS 흉내).
#   §16.1은 로컬 Hadoop catalog를 명시하나, F2 개정(prod=BigLake metastore REST catalog)과
#   Iceberg 2PC 원자 커밋(오브젝트 스토리지) 정합을 위해 로컬도 REST+MinIO로 통일한다(ledger 기록).
#
# 호스트 접속 포트:
#   Kafka   localhost:29092 / 29093 / 29094  (EXTERNAL 리스너)
#   Flink   http://localhost:8081            (JobManager REST/UI)
#   MinIO   http://localhost:9001            (콘솔), :9000 (S3 API)
#   Iceberg REST  http://localhost:8181
#   ES      http://localhost:9200
#   Kibana  http://localhost:5601

name: fleetsentinel

x-kafka-common: &kafka-common
  image: apache/kafka:4.0.0
  networks: [fleet]
  restart: unless-stopped

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # 로그 디렉토리를 마운트 볼륨으로 고정 (기본 /tmp/kafka-logs는 임시 → 재생성 시 토픽 유실)
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # HA 복제 기본값 (ADR-009: RF=3 / ISR=2 / acks=all)
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # KRaft 단일 클러스터 공유 ID (모든 노드 동일)
  CLUSTER_ID: fleetsentinel-kraft-0001

services:
  kafka1:
    <<: *kafka-common
    container_name: fleet-kafka1
    hostname: kafka1
    ports:
      - "127.0.0.1:29092:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka2:
    <<: *kafka-common
    container_name: fleet-kafka2
    hostname: kafka2
    ports:
      - "127.0.0.1:29093:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:29093
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka3:
    <<: *kafka-common
    container_name: fleet-kafka3
    hostname: kafka3
    ports:
      - "127.0.0.1:29094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:29094
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ---- Object storage (GCS 흉내) ----
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: fleet-minio
    hostname: minio
    networks: [fleet]
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 버킷 부트스트랩, 1회 실행 후 종료
  #   warehouse   — Iceberg(보류, SDD §1.5)
  #   checkpoints — Flink 체크포인트
  #   fleet-raw   — 원시 센서 클립(중량 경로, heavy-path-design.md §3)
  # ⚠️ entrypoint 는 folded scalar(>) 라 줄바꿈이 공백이 된다. 안에 '#' 를 넣으면
  #    그 뒤가 전부 셸 주석이 되어 버킷 생성이 조용히 건너뛰어진다.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: fleet-minio-init
    networks: [fleet]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin password &&
      mc mb --ignore-existing local/warehouse &&
      mc mb --ignore-existing local/checkpoints &&
      mc mb --ignore-existing local/fleet-raw &&
      echo 'minio buckets ready';
      "
    restart: "no"

  # ---- Iceberg REST catalog (prod = BigLake metastore REST 정합) ----
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.0  # P2에서 Iceberg 1.11.x 라인 정렬(§4.1.1, arch A6). REST 프로토콜은 안정.
    container_name: fleet-iceberg-rest
    hostname: iceberg-rest
    networks: [fleet]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config?warehouse=s3://warehouse/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---- Flink (JobManager + TaskManager) ----
  jobmanager:
    image: flink:2.0.0-java17
    container_name: fleet-jobmanager
    hostname: jobmanager
    networks: [fleet]
    ports:
      - "127.0.0.1:8081:8081"
    command: jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # S3 파일시스템 플러그인 활성 (체크포인트 s3://checkpoints/ 용, arch A2)
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-2.0.0.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.backend.type: rocksdb
        state.checkpoints.dir: s3://checkpoints/flink
        state.savepoints.dir: s3://checkpoints/savepoints
        state.backend.incremental: true
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: admin
        s3.secret-key: password
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      # G007: fat jar bind-mounted read-only so `docker compose exec jobmanager flink run` can
      # submit it to the real cluster (빌드·제출 절차는 v3.0 파이프라인 재작성 시 확정).
      - ../flink-pipeline/target/fleetsentinel-flink-pipeline.jar:/jars/fleetsentinel.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  taskmanager:
    image: flink:2.0.0-java17
    container_name: fleet-taskmanager
    hostname: taskmanager
    networks: [fleet]
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    scale: 1
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-2.0.0.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: rocksdb
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: admin
        s3.secret-key: password

  # ---- 저장·질의 ----
  # ClickHouse LTS. Elasticsearch·Kibana를 대체한다 — 근거는 docs/sdd.md §4.1 A-8.
  # 요약: 지리 인덱스가 필요 없는 규모(수백 행)이고, 자체 대시보드가 Kibana를 대체한다.
  clickhouse:
    image: clickhouse:26.3   # LTS 라인. 이동 태그(:lts) 대신 명시적 핀
    container_name: fleet-clickhouse
    hostname: clickhouse
    networks: [fleet]
    ports:
      - "127.0.0.1:8124:8123"   # HTTP (호스트 8123은 타 프로세스가 점유할 수 있어 8124로)
      - "127.0.0.1:9009:9000"   # 네이티브 프로토콜 (호스트 9000은 MinIO가 점유)
    environment:
      CLICKHOUSE_DB: fleet
      CLICKHOUSE_USER: fleet
      CLICKHOUSE_PASSWORD: fleet
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

networks:
  fleet:
    name: fleet

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  minio-data:
  clickhouse-data:
  flink-checkpoints:
